<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenChat</title>
  <desc id="desc">OpenChat landing hero. A personal AI workspace on your own Cloudflare account.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8eb6ff">
        <animate attributeName="stop-color" values="#8eb6ff;#d7ccff;#8eb6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f0c27a">
        <animate attributeName="stop-color" values="#f0c27a;#8eb6ff;#f0c27a" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="760" rx="28"/></clipPath>
    <clipPath id="screen"><rect x="150" y="292" width="900" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="760" fill="#0c0d11"/>
    <g filter="url(#glow)" opacity="0.9">
      <circle r="170" fill="#315fd6">
        <animate attributeName="cx" values="160;300;160" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="40;120;40" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" fill="#7a58d6">
        <animate attributeName="cx" values="1040;900;1040" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="220;120;220" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle r="80" fill="#d7a85a">
        <animate attributeName="cx" values="620;720;620" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="20;70;20" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="1" y="1" width="1198" height="758" rx="28" fill="none" stroke="url(#edge)" stroke-opacity="0.4"/>

    <text x="600" y="78" text-anchor="middle" fill="#c8c4ba" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3.2">PERSONAL AI WORKSPACE</text>
    <text x="600" y="142" text-anchor="middle" fill="#f7f4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="650" letter-spacing="-1.8">OpenChat</text>
    <text x="600" y="186" text-anchor="middle" fill="#c9c6bf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Chat, agents, memory, images, and research.</text>
    <text x="600" y="214" text-anchor="middle" fill="#9d9a93" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Open-weight models on Cloudflare Workers AI. Your account.</text>

    <g clip-path="url(#screen)">
      <rect x="150" y="292" width="900" height="400" fill="#14161c"/>
      <rect x="150" y="292" width="210" height="400" fill="#101217"/>
      <text x="174" y="332" fill="#f4f1ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650">OpenChat</text>
      <text x="174" y="378" fill="#d9d6cf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">New chat</text>
      <text x="174" y="408" fill="#8e8b85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Agents</text>
      <text x="174" y="438" fill="#8e8b85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Images</text>
      <text x="174" y="468" fill="#8e8b85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Research</text>
      <rect x="392" y="360" width="280" height="36" rx="18" fill="#242833"/>
      <text x="410" y="384" fill="#f4f1ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Plan a research brief</text>
      <rect x="700" y="430" width="300" height="72" rx="16" fill="#1c2433"/>
      <text x="720" y="460" fill="#e7e4dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Llama 3.3 70B is ready.</text>
      <text x="720" y="482" fill="#a9b4c7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Ask in the composer below.</text>
      <rect x="392" y="620" width="620" height="46" rx="14" fill="#1a1d25" stroke="#2c3140"/>
      <text x="412" y="648" fill="#8e8b85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Message OpenChat</text>
      <rect x="968" y="632" width="28" height="22" rx="6" fill="#f4f1ea">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="150" y="292" width="900" height="400" rx="18" fill="none" stroke="#2a2e3a"/>
  </g>
</svg>

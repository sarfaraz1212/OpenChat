<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenChat</title>
  <desc id="desc">OpenChat, a personal AI workspace on your own Cloudflare account.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8eb6ff">
        <animate attributeName="stop-color" values="#8eb6ff;#d7ccff;#8eb6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f0c27a">
        <animate attributeName="stop-color" values="#f0c27a;#8eb6ff;#f0c27a" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8eb6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0c27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="520" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="#101114"/>
    <g filter="url(#glow)" opacity="0.85">
      <circle r="150" fill="#3c6fe0">
        <animate attributeName="cx" values="180;320;180" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="40;140;40" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="#8a6ae0">
        <animate attributeName="cx" values="980;820;980" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="420;280;420" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle r="90" fill="#e0b15a">
        <animate attributeName="cx" values="640;760;640" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;40;80" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="1" y="1" width="1198" height="518" rx="28" fill="none" stroke="url(#edge)" stroke-opacity="0.45"/>
    <g transform="translate(600 168)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5.5s" repeatCount="indefinite"/>
        <g transform="scale(0.16) translate(-448 -448)" fill="#f7f4ee">
          <path d="M178 98h480c44.2 0 80 35.8 80 80v100c0 44.2-35.8 80-80 80h-48l48 110-160-110H178c-44.2 0-80-35.8-80-80V178c0-44.2 35.8-80 80-80Z"/>
          <path d="M178 98h480c44.2 0 80 35.8 80 80v100c0 44.2-35.8 80-80 80h-48l48 110-160-110H178c-44.2 0-80-35.8-80-80V178c0-44.2 35.8-80 80-80Z" transform="rotate(180 448 448)"/>
        </g>
      </g>
    </g>
    <text x="600" y="292" text-anchor="middle" fill="#f7f4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-1.5">OpenChat</text>
    <text x="600" y="338" text-anchor="middle" fill="#c8c6c1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">A personal AI workspace on your own Cloudflare account</text>
    <rect x="430" y="372" width="340" height="2" fill="url(#rule)">
      <animate attributeName="x" values="250;610;250" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g fill="#d9d6cf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
      <text x="470" y="430">Chat</text>
      <text x="560" y="430">Agents</text>
      <text x="660" y="430">Memory</text>
      <text x="760" y="430">Images</text>
    </g>
  </g>
</svg>
